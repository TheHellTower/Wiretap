[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Dependency policy: every crate here is attack surface. Add one only when no small,
# reviewable alternative exists, disable default features, and justify it in INFO/RESEARCH.md.
[workspace.dependencies]
wiretap-core = { path = "crates/wiretap-core" }
wiretap-autoreply = { path = "crates/wiretap-autoreply" }
wiretap-codec = { path = "crates/wiretap-codec" }
wiretap-capture = { path = "crates/wiretap-capture" }
wiretap-driver-client = { path = "crates/wiretap-driver-client" }
wiretap-driver-proto = { path = "crates/wiretap-driver-proto" }
wiretap-platform = { path = "crates/wiretap-platform" }
wiretap-protocol = { path = "crates/wiretap-protocol" }
wiretap-proxy = { path = "crates/wiretap-proxy" }
wiretap-storage = { path = "crates/wiretap-storage" }
wiretap-ui = { path = "crates/wiretap-ui" }
wiretap-tls = { path = "crates/wiretap-tls" }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
windows-sys = { version = "0.61.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
