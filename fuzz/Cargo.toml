[package]
name = "wiretap-fuzz"
description = "libFuzzer harnesses for every Wiretap component and the dependency entry points it uses"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Harnesses live in the library so `cargo test --no-default-features` can replay the corpus
# and regression inputs on stable Rust without linking libFuzzer.
[features]
default = ["libfuzzer"]
libfuzzer = ["dep:libfuzzer-sys"]

[dependencies]
arbitrary = "1.5.0"
brotli = { version = "9.1.1", default-features = false, features = ["std"] }
libfuzzer-sys = { version = "0.4.13", optional = true }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
wiretap-autoreply = { path = "../crates/wiretap-autoreply" }
wiretap-capture = { path = "../crates/wiretap-capture" }
wiretap-cli = { path = "../crates/wiretap-cli" }
wiretap-codec = { path = "../crates/wiretap-codec" }
wiretap-core = { path = "../crates/wiretap-core" }
wiretap-driver-proto = { path = "../crates/wiretap-driver-proto" }
wiretap-platform = { path = "../crates/wiretap-platform" }
wiretap-protocol = { path = "../crates/wiretap-protocol" }
wiretap-storage = { path = "../crates/wiretap-storage" }
wiretap-tls = { path = "../crates/wiretap-tls" }
wiretap-ui = { path = "../crates/wiretap-ui" }
zstd = { version = "0.14.3", default-features = false }

# Standalone workspace: fuzzing builds use nightly and sanitizer flags.
[workspace]

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "event_json"
path = "fuzz_targets/event_json.rs"
required-features = ["libfuzzer"]
test = false
doc = false
bench = false

