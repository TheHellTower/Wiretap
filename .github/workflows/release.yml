# Builds the release package and puts it in a *draft* GitHub release, ready to review and publish.
# The package is test-signed, for lab machines and VMs in test-signing mode (SETUP.md 3b): each
# run creates its own test certificate, signs the driver, its catalog and wiretap.exe with it, and
# ships the certificate's public part. The private key never leaves the throwaway runner.
# Production releases need Microsoft attestation signing instead (RELEASE.md 4b).
#
# Runs on a version tag (v0.2.0, matching Cargo.toml) or by hand (Actions, release, Run workflow).
# Re-running updates the same draft.name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # RFC 3161 timestamps keep the signatures valid after the one-year test certificate expires.
  TIMESTAMP: http://timestamp.digicert.com

jobs:
  draft:
    runs-on: windows-2025
    permissions:
      contents: write # create or update the draft release, nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version and tag
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "tag $env:GITHUB_REF_NAME does not match the workspace version $version (expected $tag)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Fetch the WebView2 SDK (version and SHA-512 pinned in tools/webview2-sdk.txt)
        shell: pwsh
        run: ./tools/fetch-webview2.ps1

      - name: Tests (the full gates run in the ci workflow)
        run: cargo test --workspace --locked

      - name: Install WDK
        run: winget install --id Microsoft.WindowsWDK.10.0.26100 --exact --source winget --accept-package-agreements --accept-source-agreements --disable-interactivity

      - name: Build and test-sign the driver package (layout check, INF validation, catalog)
        shell: pwsh
        run: ./tools/build-driver.ps1 -NewTestCert -TimestampUrl $env:TIMESTAMP -Version "${{ steps.version.outputs.version }}.0"

      - name: Package (wiretap.exe signed with the same test certificate)
        shell: pwsh
        run: |
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object Subject -eq 'CN=Wiretap Test Driver Signing (lab only)' | Sort-Object NotBefore | Select-Object -Last 1
          ./tools/package-release.ps1 -CertThumbprint $cert.Thumbprint -TimestampUrl $env:TIMESTAMP -IncludeTestCertificate -Label '-test-signed'

      - name: Create or update the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $dir = 'target/release-package'
          $files = @("$dir/wiretap-$env:VERSION-x64-test-signed.zip", "$dir/SHA256SUMS.txt")
          $commit = (git rev-parse --short HEAD).Trim()
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          # Literal here-string: Markdown backticks would be PowerShell escapes in a double-quoted one.
          $notes = @'
          Built by GitHub Actions on {date} UTC from commit {commit}.

          > [!IMPORTANT]
          > **Test-signed package, for lab machines and VMs only.** The driver and `wiretap.exe` are signed with a test certificate made for this build alone; its private key existed only on the build machine and is gone. Windows loads the driver only in test-signing mode (Secure Boot off) with `WiretapTestSigning.cer` trusted: follow [SETUP.md, section 3b](https://github.com/{repo}/blob/main/SETUP.md). Never enable test signing on a machine you rely on.

          Install, in an elevated terminal in the unzipped folder:
          ```powershell
          bcdedit /set testsigning on      # Secure Boot must be off
          certutil -addstore Root .\WiretapTestSigning.cer
          certutil -f -addstore TrustedPublisher .\WiretapTestSigning.cer
          Restart-Computer
          # after the reboot, elevated again:
          pnputil /add-driver .\driver\WiretapDriver.inf /install
          .\wiretap.exe
          ```
          Check the download against `SHA256SUMS.txt`.

          See [PROGRESS.md](https://github.com/{repo}/blob/main/PROGRESS.md) for what this version does and what remains open.
          '@ -replace '\{date\}', $date -replace '\{commit\}', $commit -replace '\{repo\}', $env:GITHUB_REPOSITORY
          # gh.exe by name: PowerShell names are case-insensitive, so a function named like the
          # command would call itself.
          function Invoke-Gh { gh.exe @args; if ($LASTEXITCODE -ne 0) { throw "gh $($args[0..1] -join ' ') failed" } }
          $existing = gh.exe release view $env:TAG --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -ne 'true') { throw "release $env:TAG is already published: refusing to change it" }
            Invoke-Gh release upload $env:TAG @files --clobber
            Invoke-Gh release edit $env:TAG --notes $notes
          } else {
            Invoke-Gh release create $env:TAG @files --draft --title "Wiretap $env:VERSION" --notes $notes --target $env:GITHUB_SHA
          }
