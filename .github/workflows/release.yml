# Builds the release package and puts it in a *draft* GitHub release, for review before
# publishing. CI cannot sign: the driver needs Microsoft attestation signing and wiretap.exe the
# maintainer's code-signing certificate (RELEASE.md 4b, 4d), so the draft carries an unsigned
# package to check and replace with the signed one before publishing.
#
# Runs on a version tag (v0.2.0, matching Cargo.toml) or by hand (Actions, release, Run workflow).
# Re-running updates the same draft.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    runs-on: windows-2025
    permissions:
      contents: write # create or update the draft release, nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version and tag
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "tag $env:GITHUB_REF_NAME does not match the workspace version $version (expected $tag)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Fetch the WebView2 SDK (version and SHA-512 pinned in tools/webview2-sdk.txt)
        shell: pwsh
        run: ./tools/fetch-webview2.ps1

      - name: Tests (the full gates run in the ci workflow)
        run: cargo test --workspace --locked

      - name: Install WDK
        run: winget install --id Microsoft.WindowsWDK.10.0.26100 --exact --source winget --accept-package-agreements --accept-source-agreements --disable-interactivity

      - name: Build the driver package (layout check, INF validation, catalog; unsigned)
        shell: pwsh
        run: ./tools/build-driver.ps1 -Version "${{ steps.version.outputs.version }}.0"

      - name: Package
        shell: pwsh
        run: ./tools/package-release.ps1 -Label '-unsigned'

      - name: Create or update the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $dir = 'target/release-package'
          $files = @("$dir/wiretap-$env:VERSION-x64-unsigned.zip", "$dir/SHA256SUMS.txt")
          $commit = (git rev-parse --short HEAD).Trim()
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          $notes = @"
          Built by GitHub Actions on $date UTC from commit $commit.

          > [!WARNING]
          > Draft package, **unsigned**: WiretapDriver.sys and wiretap.exe are not signed, so Windows will not load this driver as it is (lab use needs the test signature: `tools\build-driver.ps1 -CertThumbprint`).
          > Before publishing, replace it with the signed package: driver attestation-signed by Microsoft, wiretap.exe signed and timestamped (RELEASE.md, sections 4b, 4d and 6). Check the release checklist (RELEASE.md, section 8).

          See [PROGRESS.md](https://github.com/$env:GITHUB_REPOSITORY/blob/main/PROGRESS.md) for what this version does and what remains open.
          "@
          # gh.exe by name: PowerShell names are case-insensitive, so a function named like the
          # command would call itself.
          function Invoke-Gh { gh.exe @args; if ($LASTEXITCODE -ne 0) { throw "gh $($args[0..1] -join ' ') failed" } }
          $existing = gh.exe release view $env:TAG --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -ne 'true') { throw "release $env:TAG is already published: refusing to change it" }
            Invoke-Gh release upload $env:TAG @files --clobber
            Invoke-Gh release edit $env:TAG --notes $notes
          } else {
            Invoke-Gh release create $env:TAG @files --draft --title "Wiretap $env:VERSION" --notes $notes --target $env:GITHUB_SHA
          }
