# Quality gates for every push and pull request. Third-party actions are pinned to commit SHAs.
# GitHub-hosted runners are Windows *Server*; Windows 10/11 client and driver runtime tests run on
# self-hosted lab runners (tools/vm-test.ps1) when the WIRETAP_LAB_RUNNERS variable is "true".
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  user-mode:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - name: Fetch the WebView2 SDK (version and SHA-512 pinned in tools/webview2-sdk.txt)
        shell: pwsh
        run: ./tools/fetch-webview2.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Replay fuzz corpus and regressions
        run: cargo test --manifest-path fuzz/Cargo.toml --no-default-features --locked

  supply-chain:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo install --locked cargo-deny cargo-audit
      - run: cargo deny check
      - run: cargo deny --manifest-path fuzz/Cargo.toml check
      - run: cargo audit
      - name: Every dependency on its newest release
        run: .\tools\check-latest.ps1 Cargo.lock fuzz\Cargo.lock driver\Cargo.lock

  driver:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install WDK
        run: winget install --id Microsoft.WindowsWDK.10.0.26100 --exact --source winget --accept-package-agreements --accept-source-agreements --disable-interactivity
      - name: Lint driver
        working-directory: driver
        run: |
          cargo fmt -- --check
          cargo clippy --release --locked -- -D warnings
      - name: Build, layout-check and validate the (unsigned) package
        shell: pwsh
        run: ./tools/build-driver.ps1

  fuzz-smoke:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the WebView2 SDK (version and SHA-512 pinned in tools/webview2-sdk.txt)
        shell: pwsh
        run: ./tools/fetch-webview2.ps1
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Run every target for 60 s (ASan)
        shell: pwsh
        working-directory: fuzz
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $asan = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter clang_rt.asan_dynamic-x86_64.dll | Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          $env:PATH = "$($asan.DirectoryName);$env:PATH"
          foreach ($t in cargo +nightly fuzz list) {
            cargo +nightly fuzz run $t -- -max_total_time=60 -rss_limit_mb=2048
            if ($LASTEXITCODE -ne 0) { throw "fuzz target $t failed" }
          }

  lab:
    if: vars.WIRETAP_LAB_RUNNERS == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-10-lab, windows-11-lab]
    runs-on: [self-hosted, '${{ matrix.runner }}']
    env:
      WIRETAP_LAB_CERT: ${{ secrets.WIRETAP_LAB_CERT }}
      WIRETAP_VM: ${{ vars.WIRETAP_VM }}
      WIRETAP_VM_CHECKPOINT: ${{ vars.WIRETAP_VM_CHECKPOINT }}
      WIRETAP_VM_USER: ${{ secrets.WIRETAP_VM_USER }}
      WIRETAP_VM_PASSWORD: ${{ secrets.WIRETAP_VM_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build test-signed package and run the VM test
        shell: pwsh
        run: |
          ./tools/build-driver.ps1 -CertThumbprint $env:WIRETAP_LAB_CERT
          cargo build --release --locked -p wiretap-cli
          $cred = [pscredential]::new($env:WIRETAP_VM_USER, (ConvertTo-SecureString $env:WIRETAP_VM_PASSWORD -AsPlainText -Force))
          ./tools/vm-test.ps1 -VMName $env:WIRETAP_VM -Credential $cred -Checkpoint $env:WIRETAP_VM_CHECKPOINT
