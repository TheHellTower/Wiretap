[package]
name = "wiretap-driver"
description = "WiretapDriver: minimal inspection-only WFP callout driver"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
bench = false

[dependencies]
wiretap-driver-proto = { path = "../crates/wiretap-driver-proto" }

# Standalone workspace: kernel builds need panic=abort and driver link flags (build.rs).
[workspace]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
overflow-checks = true
debug = "full"

[lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "warn"
