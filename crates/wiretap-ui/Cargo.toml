[package]
name = "wiretap-ui"
description = "Wiretap app: local web UI server (token-protected, loopback only), live feed and controls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
wiretap-autoreply.workspace = true
wiretap-codec.workspace = true
wiretap-core.workspace = true
wiretap-protocol.workspace = true
wiretap-proxy.workspace = true
wiretap-storage.workspace = true

[target.'cfg(windows)'.dependencies]
wiretap-driver-client.workspace = true
wiretap-driver-proto.workspace = true
wiretap-platform.workspace = true
wiretap-tls.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
